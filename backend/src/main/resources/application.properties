app.delivery.small-order-charge=${APP_SMALL_ORDER_CHARGE:0}
# ---- Temporary image tracing (logs the URL stored/returned for each product) ----
# Turn off once images are confirmed: APP_DEBUG_IMAGES=false
app.debug.images=${APP_DEBUG_IMAGES:true}

# Offline-development fake payment gateway. Keep false everywhere real money can move.
app.payments.stub-enabled=${PAYMENTS_STUB_ENABLED:false}
