# Loads backend/.env (or ../.env) so RAZORPAY_* etc. can live in a git-ignored file.
# Real environment variables always take precedence.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.application.name=namma-store-backend
server.port=${SERVER_PORT:8080}

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/namma_store_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Sampath@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- File uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

