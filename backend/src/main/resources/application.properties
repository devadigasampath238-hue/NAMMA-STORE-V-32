# ---- App ----
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:3000}

# ---- Delivery pricing ----
app.delivery.charge=${APP_DELIVERY_CHARGE:49}
app.delivery.free-above=${APP_FREE_DELIVERY_ABOVE:499}

# ---- Razorpay ----
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---- Auth ----
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:CHANGE-THIS-DEV-ONLY-SECRET-please-set-APP_AUTH_JWT_SECRET}

app.super-admin.name=${SUPER_ADMIN_NAME:Namma Store Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@nammastore.in}
